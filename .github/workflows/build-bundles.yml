# Build one-download bundles for Windows, macOS and Linux (PyInstaller).
#
# - Manual run (Actions tab > build-bundles > Run workflow), or a push to a
#   `spike/*` test branch: builds and uploads the bundles as run artifacts
#   (sign-in needed to download; they expire).
# - Pushing a version tag (vX.Y.Z): also creates a DRAFT GitHub release with
#   the bundles attached. Nothing is public until you review the draft and
#   press "Publish release".
#
# Actions are pinned to full commit SHAs (the tested v4/v5 majors).
name: build-bundles

on:
  push:
    tags: ["v*"]
    branches: ["spike/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          # Old base on purpose: a binary built on a new distro will not run
          # on older ones (glibc).
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Linux system packages (GTK + WebKitGTK for pywebview)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config \
            python3-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pywebview
          # PyGObject 3.51+ needs girepository-2.0, which Ubuntu 22.04 lacks.
          if [ "${{ matrix.name }}" = "linux" ]; then python -m pip install pycairo "PyGObject<3.51"; fi

      - name: Build bundle
        working-directory: packaging
        shell: bash
        run: pyinstaller --noconfirm --distpath ../dist --workpath ../build/pyi recordward.spec

      - name: Smoke test (CLI passthrough)
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows" ]; then
            ./dist/RecordWard/RecordWard.exe --version
          else
            ./dist/RecordWard/RecordWard --version
          fi

      - name: Package
        shell: bash
        run: |
          VER="$(python -c 'import recordward; print(recordward.__version__)')"
          mkdir -p out
          case "${{ matrix.name }}" in
            windows) pwsh -NoProfile -Command "Compress-Archive -Path dist/RecordWard -DestinationPath out/RecordWard-$VER-windows-x64.zip" ;;
            macos)   ditto -c -k --keepParent dist/RecordWard.app "out/RecordWard-$VER-macos.zip" ;;
            linux)   tar -C dist -czf "out/RecordWard-$VER-linux-x86_64.tar.gz" RecordWard ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RecordWard-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release and upload files
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true

      - name: Create draft release with bundles
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l assets
          # Release notes = this version's section of CHANGELOG.md.
          VER="${TAG#v}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Downloads (preview):** the Windows, macOS and Linux bundles below are
          unsigned. Windows shows a SmartScreen warning ("More info" > "Run
          anyway"); macOS blocks unsigned apps by default. The Linux bundle needs
          WebKitGTK installed. Python users can instead run `pipx install git+https://github.com/Cyb3rF0xX/recordward`.
          EOF
          gh release create "$TAG" --draft --verify-tag \
            --title "RecordWard $VER" --notes-file notes.md assets/*
