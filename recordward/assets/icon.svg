  <path d="M290 168 V208 H330 Z" fill="#2a2f3a"/>
  <!-- check: verified -->
  <path d="M218 262 L248 292 L304 228" fill="none" stroke="#4ade80" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
